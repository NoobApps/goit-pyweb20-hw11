services:
  # Сервіс бази даних PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: contacts_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contacts_db
    ports:
      - "5432:5432"
    # volumes:
    #   - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contacts_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Сервіс REST API (FastAPI)
  web:
    build: .
    container_name: contacts_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/contacts_db
      - PYTHONPATH=/app/app

    # volumes:
    #   - .:/app
    depends_on:
      db:
        condition: service_healthy

